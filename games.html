<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c1a">
<title>SKYBOUND: Rift Courier</title>

<style>
:root {
  --ink: #080c1a;
  --cyan: #76f4ff;
  --gold: #ffd978;
  --pink: #ff77c8;
  --muted: #9eb8d7;
  --line: rgba(141, 223, 255, 0.26);
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--ink);
  color: #f4f8ff;
  font-family: Inter, system-ui, sans-serif;
  touch-action: manipulation;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(
      180deg,
      rgba(3, 7, 20, 0.55),
      transparent 25%,
      transparent 65%,
      rgba(2, 5, 16, 0.65)
    ),
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(2, 5, 16, 0.34) 100%
    );
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: clamp(12px, 2.3vw, 26px);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 2px 18px #000;
}

.brand-mark {
  width: 40px;
  height: 40px;
  position: relative;
  display: grid;
  place-items: center;
  border: 1px solid rgba(118, 244, 255, 0.65);
  border-radius: 13px;
  transform: rotate(-8deg);
  background: linear-gradient(
    135deg,
    rgba(118, 244, 255, 0.18),
    rgba(255, 119, 200, 0.12)
  );
  box-shadow: 0 0 25px rgba(118, 244, 255, 0.13);
}

.brand-mark::before {
  content: "";
  position: absolute;
  width: 15px;
  height: 15px;
  border: 2px solid var(--cyan);
  transform: rotate(45deg);
}

.brand-copy strong {
  display: block;
  letter-spacing: 0.24em;
  font-size: 13px;
}

.brand-copy span {
  display: block;
  margin-top: 3px;
  font-size: 9px;
  letter-spacing: 0.22em;
  color: #9fd8eb;
}

.hud {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  pointer-events: auto;
}

.hud-card {
  min-width: 78px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(7, 14, 31, 0.66);
  backdrop-filter: blur(14px);
}

.hud-card label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: #94b6d3;
  font-weight: 800;
}

.hud-card b {
  display: block;
  margin-top: 3px;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}

.hud-card.coins b {
  color: var(--gold);
}

.hud-card.score b {
  color: var(--cyan);
}

.icon-btn {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(7, 14, 31, 0.7);
  font-size: 17px;
}

.status-line {
  position: fixed;
  top: 92px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: 100px;
  border: 1px solid rgba(118, 244, 255, 0.24);
  background: rgba(7, 14, 31, 0.55);
  color: #b6d8ed;
  font-size: 10px;
  letter-spacing: 0.1em;
  white-space: nowrap;
  pointer-events: none;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
}

.power-meter {
  position: fixed;
  left: 50%;
  top: 128px;
  transform: translateX(-50%);
  display: none;
  min-width: 180px;
  text-align: center;
  pointer-events: none;
}

.power-meter.show {
  display: block;
}

.power-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  font-weight: 800;
  margin-bottom: 6px;
}

  overflow:
