<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA — Welcome</title>

<link rel="icon" href="images/hub.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --gold:#d4af37;
  --gold-light:#f1cf70;
  --white:#fff;
  --muted:#858585;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:"Inter",sans-serif;
  color:var(--white);
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 10%,rgba(212,175,55,.10),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(212,175,55,.08),transparent 30%),
    #050505;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  position:relative;
}

.glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(212,175,55,.045);
  filter:blur(90px);
  pointer-events:none;
}

.glow.one{
  top:-180px;
  left:-160px;
}

.glow.two{
  right:-160px;
  bottom:-200px;
}

.auth-container{
  width:min(1080px,100%);
  min-height:680px;
  position:relative;
  display:flex;
  background:#0b0b0b;
  border:1px solid rgba(212,175,55,.18);
  border-radius:28px;
  overflow:hidden;
  z-index:2;
  box-shadow:
    0 30px 90px rgba(0,0,0,.75),
    0 0 60px rgba(212,175,55,.035);
}

/* FORM SIDE */
.form-side{
  width:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:50px;
  background:#090909;
  position:relative;
  z-index:2;
  transition:transform .75s cubic-bezier(.77,0,.175,1);
}

.form-content{
  width:100%;
  max-width:390px;
}

.auth-container.register-mode .form-side{
  transform:translateX(100%);
}

/* BRAND PANEL */
.brand-panel{
  width:50%;
  position:absolute;
  top:0;
  right:0;
  height:100%;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px;
  background:
    linear-gradient(145deg,rgba(212,175,55,.11),transparent 42%),
    linear-gradient(160deg,#111,#080808);
  border-left:1px solid rgba(212,175,55,.12);
  transition:transform .75s cubic-bezier(.77,0,.175,1);
}

.auth-container.register-mode .brand-panel{
  transform:translateX(-100%);
  border-left:none;
  border-right:1px solid rgba(212,175,55,.12);
}

.logo-mark{
  width:75px;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--gold);
  color:var(--gold-light);
  font-family:"Cinzel",serif;
  font-size:40px;
  font-weight:800;
  margin-bottom:22px;
  box-shadow:
    inset 0 0 30px rgba(212,175,55,.06),
    0 0 25px rgba(212,175,55,.07);
}

.brand-panel h1{
  font-family:"Cinzel",serif;
  font-size:48px;
  letter-spacing:8px;
  color:var(--gold-light);
}

.tagline{
  margin-top:7px;
  color:#777;
  font-size:10px;
  letter-spacing:3px;
}

.welcome{
  margin-top:38px;
  font-family:"Cormorant Garamond",serif;
  font-size:29px;
  line-height:1.2;
  color:#e6e6e6;
}

.gold-text{
  color:var(--gold-light);
}

.description{
  margin-top:16px;
  max-width:330px;
  color:#838383;
  font-size:13px;
  line-height:1.7;
}

.online{
  position:absolute;
  bottom:35px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#606060;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.online-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 12px var(--gold);
}

/* HEADINGS */
.eyebrow{
  color:var(--gold);
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  margin-bottom:10px;
}

.form-content h2{
  font-family:"Cinzel",serif;
  font-size:34px;
  line-height:1.2;
}

.subtitle{
  margin-top:9px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.register-heading,
.register-fields{
  display:none;
}

.auth-container.register-mode .login-heading,
.auth-container.register-mode .login-fields{
  display:none;
}

.auth-container.register-mode .register-heading,
.auth-container.register-mode .register-fields{
  display:block;
}

/* FORM */
form{
  margin-top:30px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:#cacaca;
  font-size:12px;
  font-weight:600;
}

.input-wrapper{
  position:relative;
}

.input-icon{
  position:absolute;
  top:50%;
  left:16px;
  transform:translateY(-50%);
  color:#666;
  font-size:14px;
  pointer-events:none;
  transition:.2s;
}

.input-wrapper input{
  width:100%;
  height:54px;
  padding:0 48px;
  border:1px solid rgba(255,255,255,.08);
  outline:none;
  border-radius:12px;
  background:#0d0d0d;
  color:#fff;
  font-family:"Inter",sans-serif;
  font-size:13px;
  transition:.2s;
}

.input-wrapper input::placeholder{
  color:#555;
}

.input-wrapper input:focus{
  border-color:rgba(212,175,55,.65);
  box-shadow:0 0 0 3px rgba(212,175,55,.07);
  background:#101010;
}

.input-wrapper:focus-within .input-icon{
  color:var(--gold);
}

.password-button{
  position:absolute;
  top:0;
  right:0;
  width:52px;
  height:54px;
  border:none;
  background:transparent;
  color:#666;
  cursor:pointer;
}

.password-button:hover{
  color:var(--gold);
}

.password-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.password-row label{
  margin-bottom:0;
}

.forgot{
  border:none;
  background:transparent;
  color:var(--gold);
  font-size:10px;
  cursor:pointer;
}

.forgot:hover{
  color:var(--gold-light);
}

.message{
  display:none;
  padding:11px 13px;
  border-radius:10px;
  font-size:11px;
  line-height:1.5;
  margin-bottom:16px;
}

.message.show{
  display:block;
}

.message.error{
  color:#ffadad;
  background:rgba(223,104,104,.08);
  border:1px solid rgba(223,104,104,.18);
}

.message.success{
  color:#a9f0c9;
  background:rgba(85,200,138,.08);
  border:1px solid rgba(85,200,138,.18);
}

.main-button{
  width:100%;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  border:none;
  border-radius:12px;
  background:linear-gradient(
    135deg,
    #b88d22,
    var(--gold),
    var(--gold-light)
  );
  color:#070707;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.main-button:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 28px rgba(212,175,55,.17);
}

.main-button:active{
  transform:none;
}

.main-button:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.spinner{
  display:none;
  width:16px;
  height:16px;
  border:2px solid rgba(0,0,0,.25);
  border-top-color:#000;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

.loading .spinner{
  display:block;
}

.loading .button-label,
.loading .button-arrow{
  display:none;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.switch{
  margin-top:24px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  color:#777;
  font-size:11px;
}

.switch button{
  border:none;
  background:transparent;
  color:var(--gold);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.switch button:hover{
  color:var(--gold-light);
}

.secure{
  margin-top:23px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  color:#4e4e4e;
  font-size:9px;
}

.secure i{
  color:#656565;
}

/* MOBILE */
@media (max-width:850px){
  .page{
    padding:15px;
  }

  .auth-container{
    min-height:650px;
    border-radius:22px;
  }

  .brand-panel{
    display:none;
  }

  .form-side,
  .auth-container.register-mode .form-side{
    width:100%;
    padding:35px 25px;
    transform:none;
  }
}

@media (max-width:500px){
  .page{
    padding:0;
  }

  .auth-container{
    min-height:100vh;
    border-radius:0;
    border:none;
  }

  .form-side{
    padding:30px 20px;
  }

  .form-content h2{
    font-size:29px;
  }
}

@media (prefers-reduced-motion:reduce){
  .form-side,
  .brand-panel{
    transition:none;
  }
}
</style>

</head>
